apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "snowplow.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "snowplow.labels" . | nindent 4 }}
rules:
# ── Cluster-wide read for informer-driven L3 cache ──────────────────────────
# Snowplow dynamically discovers CRDs at runtime (see autoDiscoverGroups in
# cache-warmup config) and starts informers on newly-observed CR types, so
# the service account needs broad read+watch. Narrowing this requires
# enumerating every CRD that dashboards and widgets depend on transitively —
# empirically that list is much larger than the upstream chart ships and
# includes: widgets.templates.krateo.io/*, templates.krateo.io/*,
# core.krateo.io/*, composition.krateo.io/*, apiextensions.k8s.io/*,
# rbac.authorization.k8s.io/*, ogen/git/argoproj integrations, plus any
# new CRD a customer registers. The right default is broad read.
#
# This is a READ-only rule; no create/update/delete. The pod cannot mutate
# the cluster through this binding.
- apiGroups: ["*"]
  resources: ["*"]
  verbs:
  - get
  - list
  - watch

# ── Per-user authorization checks ───────────────────────────────────────────
# Snowplow creates SelfSubjectAccessReview / SubjectAccessReview to pre-
# compute RBAC for each user before serving widget responses. These APIs
# only support the `create` verb.
- apiGroups:
  - authorization.k8s.io
  resources:
  - selfsubjectaccessreviews
  - subjectaccessreviews
  verbs:
  - create

# ── #574: impersonation for the background refresher ────────────────────────
# The refresher re-resolves a cached cell under that cell's COHORT identity but
# used to dial the apiserver with snowplow's own ServiceAccount. Identity said
# cohort, transport said snowplow, so rbac.MustRegateSADial had to refuse the
# dial — ~9,400 refused background refreshes per 6h on krateo-057. The fix is to
# make the transport carry the cohort too; this rule is what permits it.
#
# WITHOUT THIS RULE THE FEATURE IS INERT, NOT BROKEN. snowplow probes
# `impersonate users` once at startup (SelfSubjectAccessReview) and, when it is
# not granted, keeps the old SA transport and logs a WARN naming this grant. So
# the chart and the image roll independently in either order. (#608: groups and
# serviceaccounts are then checked per cohort before every first dial.)
#
# WHY `users` IS SAFE TO GRANT BROADLY. Impersonating a user does NOT inherit
# that user's groups — the apiserver uses exactly the groups supplied. Verified
# on krateo-057 against a User carrying groups:["admins"], where admins is bound
# to cluster-admin:
#     --as=admin                     list secrets -> no
#     --as=admin --as-group=admins   list secrets -> yes
# It cannot be enumerated either: the target is 1000 users.
- apiGroups: [""]
  resources: ["users"]
  verbs: ["impersonate"]

{{- /*
  groups / serviceaccounts are ALLOWLISTED, and the allowlist is empty by
  default. Both carry rights DIRECTLY, so impersonating one grants what it is
  bound to — unlike the `users` case above, the no-inheritance argument does NOT
  apply here.

  THE EMPTY LIST MUST EMIT NO RULE AT ALL. In Kubernetes RBAC an absent or empty
  `resourceNames` means EVERY resource of that type, so rendering the rule with
  an empty list would grant impersonation of every group — including a
  cluster-admin-bound one — which is the exact escalation this allowlist exists
  to prevent. `with` is load-bearing: it skips the block for an empty list.

  A cohort whose group or ServiceAccount is not listed is not impersonated:
  snowplow SelfSubjectAccessReviews each principal before dialling and refreshes
  that cohort over its own ServiceAccount with the re-gate instead (#608). So the
  safe default costs "refreshed as snowplow, re-gated", never a certain 403.

  NEVER list a privileged group or ServiceAccount here.
*/ -}}
{{- with .Values.rbac.impersonateGroups }}
- apiGroups: [""]
  resources: ["groups"]
  resourceNames:
    {{- toYaml . | nindent 4 }}
  verbs: ["impersonate"]
{{- end }}
{{- with .Values.rbac.impersonateServiceAccounts }}
- apiGroups: [""]
  resources: ["serviceaccounts"]
  resourceNames:
    {{- toYaml . | nindent 4 }}
  verbs: ["impersonate"]
{{- end }}
