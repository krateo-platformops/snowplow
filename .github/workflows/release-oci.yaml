# Publishes this repo's Helm charts on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every chart repo" becomes structural
# instead of a 137-line copy each repo has to keep in step by hand.
#
# The shared workflow also gates the publish on every chart-referenced image existing: a chart that
# names an image which was never published used to publish cleanly and then ImagePullBackOff on every
# install, with the symptom surfacing several layers from the cause
# (krateo-platformops/oasgen-provider#62).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the tag this runs on."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: the tag this runs on (run from a branch: the latest tag of the app repo)."
        required: false

jobs:
  release-oci:
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@main
    permissions:
      contents: read
      packages: write
    # Both versions are the tag being released (#1057). Snowplow's chart and image are released
    # together from the same tag, so the chart for X.Y.Z must say appVersion X.Y.Z; the deployment's
    # image tag defaults to .Chart.AppVersion.
    #
    # Left empty, the shared workflow sets APP_VERSION to the newest tag in the repo, read at the
    # moment each of its jobs runs. That is only right when one tag is pushed at a time. Pushing
    # 1.12.61-1.12.64 together published 1.12.61, 1.12.62 and 1.12.63 all with appVersion 1.12.64.
    # The image check also looked the version up separately, so for 1.12.61 it checked the 1.12.61
    # image while the published chart pointed at 1.12.64.
    #
    # A manual run's inputs still override. A manual run from a branch, which has no tag, keeps the
    # shared workflow's default.
    with:
      chart_version: ${{ github.event.inputs.chart_version || (github.ref_type == 'tag' && github.ref_name || '') }}
      app_version: ${{ github.event.inputs.app_version || (github.ref_type == 'tag' && github.ref_name || '') }}
