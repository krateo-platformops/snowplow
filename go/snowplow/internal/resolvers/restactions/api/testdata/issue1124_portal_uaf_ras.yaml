# issue1124_portal_uaf_ras.yaml — five REAL portal RESTActions, vendored
# verbatim (whole documents, blank template lines included) from
# `helm template` of krateo-platformops/portal main 10e359e, for the #1124 arms
# (issue1124_uaf_own_resource_test.go).
#
#   compositions-list   (portal)           allCompositions: objects of every
#   composition-detail  (compositions-page) found:          discovered plural,
#                                           resourcesFrom over the plural set
#   projects            (portal)           namespaces: scope pruning, OR across
#   blueprint-formdef   (blueprints-page)  namespaces: the plural set, items are
#   agent-formdef       (portal-agents)    namespaces: namespaces
#
# A regression corpus, not a mirror: refresh a document only when the portal
# changes the stage the arms exercise.
---
# Source: portal/templates/restaction.compositions-list.yaml
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: compositions-list
  namespace: krateo-system
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  - name: crds
    path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
    verb: GET
    userAccessFilter:
      verb: list
      group: core.krateo.io
      resource: compositiondefinitions
      namespaceFrom: .metadata.namespace
    filter: "[.crds.items[]? | select(.status.resource != null and .status.apiVersion != null) | {plural: .status.resource, version: (.status.apiVersion | split(\"/\")[1])}] | unique"
    continueOnError: true
    errorKey: crdsError
  - name: allCompositions
    
    
    
    
    
    
    
    
    
    
    
    
    
    dependsOn:
      name: crds
      iterator: ".crds"
    path: ${ "/apis/composition.krateo.io/" + (.version) + "/" + (.plural) }
    verb: GET
    continueOnError: true
    errorKey: allCompositionsError
    userAccessFilter:
      verb: list
      group: composition.krateo.io
      resourcesFrom: "[ (.crds // [])[] | .plural ]"
      namespaceFrom: .metadata.namespace
    filter: >
      [.allCompositions.items[]?
       | {uid: .metadata.uid, name: .metadata.name, ns: .metadata.namespace, ts: .metadata.creationTimestamp, kind: .kind, av: .apiVersion, conditions: (.status.conditions // []), wh: .status.workloadHealthy, whMsg: (.status.healthMessage // ""), platform: ((((.metadata.labels // {})["krateo.io/composition-name"]) == "installer") or (((.metadata.labels // {})["krateo.io/composition-definition-name"]) == "installer"))}]
  
  
  
  
  
  
  
  
  
  
  
  
  
  filter: >
    (((.projects // "") | split(",") | map(select(. != ""))) as $projSel
     | ((.project // .namespace) // "") as $proj
     | if ($projSel | length) > 0 then $projSel elif $proj != "" then [$proj] else [] end) as $projects
    | (.status // "all") as $status
    | (.scope // "workloads") as $scope
    | ((.q // "") | ascii_downcase) as $q
    | now as $now
    | ((.allCompositions // []) | map(select(($projects | length) == 0 or (([.ns] - $projects) | length == 0))) | map(. + ((.conditions // []) as $c | (any($c[]?; .type == "Ready" and .status == "True")) as $ready | (any($c[]?; .type == "Ready" and .status == "False")) as $notready | (any($c[]?; .type == "Synced" and .status == "False")) as $unsynced | ($ready and (.wh == false)) as $degraded | {conditions: ((.conditions // []) + (if .wh == false then [{type: "Workload", status: "False", reason: "Unhealthy", message: (.whMsg // "")}] else [] end)), state: (if $notready then "failed" elif $degraded then "degraded" elif $ready then "healthy" else "pending" end), railState: (if $notready then "failed" elif $degraded then "degraded" elif $ready and ($unsynced | not) then "healthy" elif $ready and $unsynced then "drift" else "pending" end), healthPercent: (if $notready then 20 elif $degraded then 50 elif $ready and ($unsynced | not) then 100 elif $ready and $unsynced then 50 else 50 end)}))) as $all
    | $all as $dated
    | ($dated | map(select(if $scope == "all" then true elif $scope == "platform" then .platform else (.platform | not) end))) as $scoped
    | {
        list: $all,
        filtered: ($scoped | map(select((if $status == "drift" then (.railState == "drift") else ($status == "all" or .state == $status) end) and ($q == "" or ((.name // "") | ascii_downcase | contains($q)) or ((.kind // "") | ascii_downcase | contains($q)))))),
        counts: {all: ($scoped | length), healthy: ($scoped | map(select(.state == "healthy")) | length), drift: ($scoped | map(select(.railState == "drift")) | length), pending: ($scoped | map(select(.state == "pending")) | length), degraded: ($scoped | map(select(.state == "degraded")) | length), failed: ($scoped | map(select(.state == "failed")) | length)},
        scopeCounts: {workloads: ($dated | map(select(.platform | not)) | length), platform: ($dated | map(select(.platform)) | length), all: ($dated | length)},
        scope: $scope,
        status: $status,
        q: ((.q // "") | tostring),
        projects: ((.projects // "") | tostring)
      }
---
# Source: portal/templates/restaction.projects.yaml
apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: projects
  namespace: krateo-system
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    
    
    - name: crds
      path: /apis/core.krateo.io/v1alpha1/compositiondefinitions
      verb: GET
      userAccessFilter:
        verb: list
        group: core.krateo.io
        resource: compositiondefinitions
        namespaceFrom: .metadata.namespace
      filter: "[.crds.items[]? | select(.status.resource != null) | .status.resource] | unique"
      continueOnError: true
      errorKey: crdsError
    
    - name: namespaces
      path: /api/v1/namespaces
      verb: GET
      dependsOn:
        name: crds
      continueOnError: true
      errorKey: namespacesError
      userAccessFilter:
        verb: list
        group: composition.krateo.io
        resourcesFrom: "[ (.crds // [])[] ]"
        namespaceFrom: .metadata.name
  
  
  filter: >
    {
      options: (
        [ .namespaces.items[]? | { label: .metadata.name, value: .metadata.name } ]
        | sort_by(.value)
      )
    }
