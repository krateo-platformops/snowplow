apiVersion: templates.krateo.io/v1
kind: RESTAction
metadata:
  name: review-proposal
  namespace: krateo-reviews
  annotations:
    "krateo.io/verbose": "true"
spec:
  api:
    
    
    
    - name: proposal
      dependsOn:
        name: ""
        iterator: '[ { name: (.name // "") } | select(.name != "") ]'
      path: ${ "/apis/review.krateo.io/v1alpha1/namespaces/default/proposals/" + .name }
      verb: GET
      headers:
