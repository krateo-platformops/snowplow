            title: ($p.spec.title // $name),
            kind: ($p.spec.kind // "—"),
            phase: $ph,
            phaseColor: ($ph | rv_phase_color),
            subject: ($p.spec.subject // ""),
            run: ($p.spec.producedBy.runRef // ""),
            proposedAt: ($p.metadata.creationTimestamp | rv_when),
            runPath: (if ($p.spec.producedBy.runRef // "") == "" then "" else "/reviews/runs/" + $p.spec.producedBy.runRef end),
            rationale: ($p.spec.rationale // "No rationale recorded."),
            
            evidenceRows: [ ($p.spec.evidence // [])[] | { source: (.source // "unknown"), summary: (.summary // "—"),
                            counted: (if .observedCount == null then "—" else ("the model counted " + (.observedCount | rv_num)) end) } ],
            evidenceCount: (($p.spec.evidence // []) | length),
            facts: ([
              { label: "Proposed target", value: (if $repo == "" then "—" else $repo + " · " + ($p.spec.target.path // "no path given") + " (the model's choice; the pull request settles where it lands)" end) },
              { label: "Target check", value: (
                  if $tc.state == "found" then "Repository found (public)"
                  elif $tc.state == "unverified" then "Target unverified: " + $tc.message
                  elif $tc.state == "invalid" then "Target invalid: " + $tc.message
                  elif $tc.state == "unanswered" then "Not answered (" + $tc.reason + ")"
                  else "Not checked (proposal predates the check)" end) },
              { label: "Model says", value: (($p.spec.confidence // "—") + " (unverified)") },
              { label: "Produced by", value: (($p.spec.producedBy.runRef // "—") + (if ($p.spec.producedBy.agent // "") != "" then " · " + $p.spec.producedBy.agent else "" end)) },
              { label: "Decision", value: (
                  if $ph == "Rejected" then ("Rejected" + (if $d.by != "" then " by " + $d.by else "" end)
                                             + (if $d.at != "" then " · " + ($d.at | rv_when) else "" end)
                                             + (if $d.reason != "" then " · " + $d.reason else "" end))
                  elif $ph == "Merged" or $ph == "Failed" then ($ph + (if $d.by != "" then " · change request opened by " + $d.by else "" end))
                  elif $ph == "PrOpen" or $claim != null then ("Change request opened (" + $claimName + ")"
                                             + (if $d.by != "" then " by " + $d.by else "" end)
                                             + (if $d.at != "" then " · " + ($d.at | rv_when) else "" end)
                                             + "; decided when its pull request is merged or closed")
                  elif $ph == "Superseded" then "Superseded before a decision"
                  else "Not decided" end) }
