              { label: "Change request", value: ($claimName + " · branch " + ($claim.spec.branch // $branch)
                  + (if $pr == null then " · pull request not opened yet"
                     else " · pull request #" + (($pr.status.number // 0) | tostring) + " " + ($pr.status.state // "pending")
                          + (if ($pr.status.html_url // "") != "" then " · " + $pr.status.html_url else "" end) end)) } ] else [] end)
               + (if ($p.status.error // "") != "" then [ { label: "Error", value: $p.status.error } ] else [] end)),
            format: $fmt,
            changeMeta: ("format: " + $fmt + " · " + (($content | utf8bytelength) | tostring) + " bytes"),
            changeMarkdown: (if $fmt == "markdown" then $content
                             else ($fence + (if $fmt == "diff" then "diff" else "yaml" end) + "\n" + $content + "\n" + $fence) end),
            kindCheck: $kc,
            kindAlert: (if $kc.state == "notServed" then
                          ("The change is a " + $kc.gv + " " + $kc.kind + ". This cluster serves no such kind, so applying the file here would fail. The pull request can still be opened for a reviewer to rework.")
                        else "" end),
            targetAlert: (if $tc.state == "unverified" then
                            ("The proposed repository " + $repo + " did not resolve: " + $tc.message + " Correct the repository in the change request dialog if it belongs elsewhere.")
                          elif $tc.state == "invalid" then ("The proposed target " + $repo + " is not an owner/name repository. Correct it in the change request dialog.")
                          else "" end),
            lineageAlert: (if $byP != null then ("Superseded by " + $by + " (" + ($byP.spec.title // $by) + "), a later run's proposal for the same finding. Nothing here is open.")
                           elif $by != "" then ("Superseded by " + $by + ", which no longer exists.")
                           elif ($earlier | length) > 0 then ("Replaces " + (($earlier | length) | tostring) + " earlier proposal" + (if ($earlier | length) > 1 then "s" else "" end) + " for the same finding, listed under Earlier proposals.")
                           else "" end),
            supersededByPath: (if $byP != null then "/reviews/proposals/" + $by else "" end),
            earlierRows: [ $earlier[] | { name: .metadata.name, title: (.spec.title // .metadata.name), run: (.spec.producedBy.runRef // "—"),
                                          created: (.metadata.creationTimestamp // ""), target: (.spec.target.repo // "—") } ],
            
            canOpen: (($ph == "Proposed") and $claim == null and ((.bpError // null) == null)),
            
            
            canReject: ($ph == "Proposed" or $ph == "PrOpen"),
            
            
            canRecord: ($ph == "Proposed" and $claim != null and (($p.spec.decision // null) == null)),
            claimName: $claimName,
            branch: $branch,
            prTitle: ("review: " + ($p.spec.title // $name)),
            prBody: ("Proposed by the Krateo nightly review (" + ($p.spec.producedBy.runRef // "?") + "), proposal " + $name + ".\n\n"
                     + ($p.spec.rationale // "") + "\n\nEvidence, as the model reported it (unverified):\n"
                     + ([ ($p.spec.evidence // [])[] | "- " + (.source // "?") + ": " + (.summary // "") ] | join("\n"))),
            repository: $repo,
            file: ($p.spec.target.path // ""),
            content: $content,
            bpApiVersion: (.bp.status.apiVersion // ""),
            bpResource: (.bp.status.resource // "builderpublishes"),
            dialogFacts: [
              { label: "Branch", value: $branch },
              { label: "Pull request title", value: ("review: " + ($p.spec.title // $name)) },
              { label: "Created as", value: ("BuilderPublish " + $claimName + " · builder: review · repository.create: false") },
              { label: "Change", value: ("format: " + $fmt + " · " + (($content | utf8bytelength) | tostring) + " bytes") } ],
            askHref: ("/reviews/proposals/" + $name + "?ask=" + (("Review the nightly-review proposal " + $name + " (\"" + ($p.spec.title // $name) + "\"): check its evidence against the platform's telemetry, say whether the proposed change fits this platform, and what I should do with it.") | @uri)) }
      end
