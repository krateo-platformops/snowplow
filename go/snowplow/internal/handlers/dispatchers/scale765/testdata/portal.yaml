apiVersion: widgets.templates.krateo.io/v1beta1
kind: Table
metadata:
  annotations:
    krateo.io/verbose: 'true'
  name: compositions-table
  namespace: krateo-system
spec:
  apiRef:
    name: compositions-list
    namespace: krateo-system
  keyExtras:
  - projects
  - q
  - scope
  - status
  - namespace
  resourcesRefs:
    items: []
  widgetData:
    allowedResources: []
    bordered: false
    columns:
    - title: Name
      valueKey: name
    - title: Type
      valueKey: kind
    - title: Namespace
      valueKey: ns
    - title: Status
      valueKey: status
    - title: Reconcile
      valueKey: reconcile
    - title: Created
      valueKey: age
    dataSource: []
    fitContent: true
    rowNavigateTo: /compositions/{ns}/{name}
    size: small
    watch: []
  widgetDataTemplate:
  - expression: '${ (if .slice then (.filtered[.slice.offset : (.slice.offset + .slice.perPage)]) else .filtered end) as $rows | [ $rows[] | [ {valueKey:"name",kind:"jsonSchemaType",type:"string",stringValue:.name}, {valueKey:"kind",kind:"jsonSchemaType",type:"string",stringValue:.kind}, {valueKey:"ns",kind:"jsonSchemaType",type:"string",stringValue:.ns}, {valueKey:"status",kind:"conditions",stringValue:(((.conditions // []) | sort_by([(if .type=="Ready" then 0 elif .type=="Synced" then 1 else 2 end), .type]) | map({type:(if .status=="True" then .type elif .status=="False" then (if .type=="Workload" then "Unhealthy" else ("Not" + .type) end) else (.type + "Unknown") end), status:.status, color:(if .status=="True" then "green" elif .status=="False" then "red" else "gray" end)})) | tojson)}, {valueKey:"reconcile",kind:"tag",stringValue:( .railState | if .=="healthy" then "Converged" elif .=="failed" then "Failed" elif .=="drift" then "Drift" elif .=="degraded" then "Degraded" else "Pending" end),color:( .railState | if .=="healthy" then "green" elif .=="failed" then "red" elif .=="drift" then "violet" elif .=="degraded" then "orange" else "orange" end )}, {valueKey:"age",kind:"jsonSchemaType",type:"string",stringValue:.ts,format:"relative"} ] ] }'
    forPath: dataSource
  - expression: '${ { total: (.filtered | length), pageSize: (.slice.perPage // 50), current: (.slice.page // 1) } }'
    forPath: pagination
  - expression: '${ [ .list[] | { apiVersion: .av, kind: .kind } ] | unique }'
    forPath: watch
---
