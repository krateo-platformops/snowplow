[pytest]
# #1170: every process a test starts belongs to the test and is killed and reaped when the test
# ends; the session fails if one outlives every test (tests/procreap.py). It is a plugin, not a
# conftest, so the controller of a parallel run (pytest-xdist, #1166) loads it as well.
addopts = -p tests.procreap
pythonpath = .
